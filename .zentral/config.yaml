systemPrompt: >-
  Walker is a Rust 2024 GTK4/Wayland launcher built with stable Rust.
  Use Cargo.lock for reproducible builds and tests. Protobuf bindings are
  generated by build.rs from src/protos. Default configuration and themes
  live under resources/. Format Nix files with nix fmt.
environment:
  image:
    source: image
    reference: 'rust:trixie'
  setupCommand: >-
    apt-get update &&
    apt-get install -y --no-install-recommends
    build-essential pkg-config protobuf-compiler libgtk-4-dev
    libgtk4-layer-shell-dev libwayland-dev libpoppler-glib-dev &&
    cargo fetch --locked
  egressHosts:
    - deb.debian.org
    - index.crates.io
    - static.crates.io
  requiredTools:
    - cargo
    - rustc
    - cc
    - ld
    - pkg-config
    - protoc
commands:
  build: cargo build --release --locked
  test: cargo test --locked
